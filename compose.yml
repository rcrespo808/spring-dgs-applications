name: marketgraph
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: markets
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d markets"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - markets-data:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/markets
      DB_USER: demo
      DB_PASSWORD: local-demo-only
    depends_on:
      db:
        condition: service_healthy
volumes:
  markets-data:
