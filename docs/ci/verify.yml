name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: applications
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: local-demo-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo -d applications"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with H2
        if: matrix.database == 'h2'
        run: mvn -B verify
      - name: Verify with PostgreSQL
        if: matrix.database == 'postgres'
        env:
          DB_URL: jdbc:postgresql://localhost:5432/applications
          DB_USER: demo
          DB_PASSWORD: local-demo-only
        run: mvn -B verify
