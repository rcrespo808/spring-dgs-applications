spring:
  application:
    name: spring-dgs-applications
  datasource:
    url: ${DB_URL:jdbc:h2:mem:applications;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  graphql:
    graphiql:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
